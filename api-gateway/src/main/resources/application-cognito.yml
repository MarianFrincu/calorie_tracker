# Activated with: SPRING_PROFILES_ACTIVE=cognito (how every service runs on AWS).
# Validates access tokens issued by the Cognito user pool:
#   COGNITO_ISSUER_URI = https://cognito-idp.<region>.amazonaws.com/<userPoolId>
#   COGNITO_CLIENT_ID  = the web/desktop app client id (tokens of any other
#                        client are rejected - see CognitoAccessTokenValidator)
# Spring discovers the signing keys from the issuer's OIDC metadata and checks
# signature, expiry and issuer.

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

calorietracker:
  security:
    client-id: ${COGNITO_CLIENT_ID}
