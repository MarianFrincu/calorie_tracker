server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    # 5 s instead of 35 s, so restarted services are routable quickly.
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # Explicit routes only; nothing else is exposed.
              enabled: false
          routes:
            # First match wins, so the specific /api/ai/** comes first.
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**
            - id: backend-core
              uri: lb://backend-core
              predicates:
                - Path=/api/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # Not `gateway`: it would list the internal routes.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Public (health checks), so only UP/DOWN - no internal details.
      show-details: never
      show-components: never
