# Default LOCAL DEV experience (auto-merged by `docker compose up`).
# Sets the 'dev' profile so security is OFF and the JavaFX desktop client works
# without tokens.
#
#   docker compose up                       -> dev (no auth) - for the desktop app
#   docker compose -f docker-compose.yml up -> localjwt (real security) - for testing
services:
  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: dev
  backend-core:
    environment:
      SPRING_PROFILES_ACTIVE: dev
  ai-service:
    environment:
      SPRING_PROFILES_ACTIVE: dev
