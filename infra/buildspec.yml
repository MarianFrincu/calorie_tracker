# CI/CD steps (pipeline: infra/cloudformation/05-cicd.yaml). Every push except
# docs-only commits: 1. all tests  2. the app in Docker + browser tests
# 3. push images  4. roll ECS, wait, smoke-test the live URL.
# A failing step stops the run; nothing deploys unless 1-3 passed.

version: 0.2
env:
  variables:
    E2E_BASE_URL: http://localhost:8088
cache:
  paths:
    - '/root/.m2/**/*'
phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - docker compose version || (mkdir -p ~/.docker/cli-plugins && curl -fsSL -o ~/.docker/cli-plugins/docker-compose https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 && chmod +x ~/.docker/cli-plugins/docker-compose && docker compose version)
  pre_build:
    commands:
      - |
        # Docs-only commits (Markdown, screenshots) skip the whole run.
        if git rev-parse HEAD~1 >/dev/null 2>&1 \
           && ! git diff --name-only HEAD~1 HEAD | grep -qvE '\.md$|^docs/'; then
          echo "==> Only documentation changed - nothing to build."
          touch /tmp/skip
        fi
      - '[ -f /tmp/skip ] || aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR'
  build:
    commands:
      - |
        if [ -f /tmp/skip ]; then exit 0; fi
        set -e
        echo "==> 1/4 Unit + integration tests (backend-core runs against a real PostgreSQL)"
        for m in eureka-server api-gateway ai-service backend-core desktop-client; do
          echo "── ${m} ──"
          (cd "$m" && mvn -B -q clean verify)
        done
      - |
        if [ -f /tmp/skip ]; then exit 0; fi
        set -e
        echo "==> 2/4 Whole app in Docker + browser tests of every feature (desktop + phone)"
        docker compose build
        docker compose up -d --wait
        PW=$(python3 -c "import json;print(json.load(open('web-client/package-lock.json'))['packages']['node_modules/@playwright/test']['version'])")
        docker run --rm --network host -e E2E_BASE_URL -e E2E_ALLOW_DELETE=1 \
          -v "$PWD/web-client:/w" -w /w "mcr.microsoft.com/playwright:v${PW}-noble" \
          sh -c 'npm ci --no-audit --no-fund --silent && npx playwright test --output /tmp/pw' \
          || { docker compose logs --tail=200; exit 1; }
        docker compose down -v
      - |
        if [ -f /tmp/skip ]; then exit 0; fi
        set -e
        echo "==> 3/4 Build + push the cloud images"
        SHA=$(git rev-parse --short=12 HEAD)
        CLIENT_ID=$(aws cloudformation describe-stacks --stack-name "$PROJECT-cognito" \
          --query "Stacks[0].Outputs[?OutputKey=='AppClientId'].OutputValue" --output text)
        POOL_ID=$(aws cloudformation describe-stacks --stack-name "$PROJECT-cognito" \
          --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
        # The cloud web image has sign-in (the test build doesn't).
        docker build -t calorietracker/web-client:cloud \
          --build-arg VITE_AUTH_MODE=cognito \
          --build-arg VITE_COGNITO_USER_POOL_ID=$POOL_ID \
          --build-arg VITE_COGNITO_CLIENT_ID=$CLIENT_ID ./web-client
        for svc in eureka-server api-gateway backend-core ai-service web-client; do
          SRC=calorietracker/$svc:local
          [ "$svc" = web-client ] && SRC=calorietracker/web-client:cloud
          for tag in latest "$SHA"; do
            docker tag "$SRC" "$ECR/$PROJECT-$svc:$tag"
            docker push -q "$ECR/$PROJECT-$svc:$tag"
          done
        done
  post_build:
    commands:
      - |
        # post_build runs even when build failed: only deploy what passed.
        if [ -f /tmp/skip ] || [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then exit 0; fi
        set -e
        echo "==> 4/4 Deploy to ECS, wait until stable, then test the live app"
        SERVICES="$PROJECT-eureka-a $PROJECT-eureka-b $PROJECT-gateway $PROJECT-core $PROJECT-ai $PROJECT-web"
        for s in $SERVICES; do
          aws ecs update-service --cluster "$PROJECT-cluster" --service "$s" --force-new-deployment >/dev/null
        done
        # Up to 20 minutes (the waiter gives up after 10).
        aws ecs wait services-stable --cluster "$PROJECT-cluster" --services $SERVICES \
          || aws ecs wait services-stable --cluster "$PROJECT-cluster" --services $SERVICES
        sleep 30   # let Eureka propagate the new instances to the gateway
        ./scripts/smoke-test.sh
