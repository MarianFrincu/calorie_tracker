AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Calorie Tracker - Database: PostgreSQL on RDS (cheapest viable, encrypted,
  backed up, deletion-protected) plus a Secrets Manager secret holding the
  credentials. Imports networking from the foundation stack.

Parameters:
  ProjectName:
    Type: String
    Default: calorietracker
  DBEngineVersion:
    Type: String
    Default: '16.15'
    Description: >
      PostgreSQL version. AWS rotates which patch versions are valid; if this
      one is rejected, find a current one with:
        aws rds describe-db-engine-versions --engine postgres \
          --query 'DBEngineVersions[?starts_with(EngineVersion, `16.`)].EngineVersion' \
          --output text
      then deploy with --parameter-overrides DBEngineVersion=<value>.
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: >
      Smallest general-purpose class. Graviton (t4g) is ~10% cheaper than
      t3.micro for the same 2 vCPU / 1 GiB.
  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: >
      Automated daily backups + point-in-time restore window. Storage for
      backups up to the size of the database is free.

Resources:

  # Credentials live in Secrets Manager; the password is auto-generated.
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      # No fixed name: a deleted secret lingers 7-30 days and would block a redeploy.
      Description: RDS PostgreSQL credentials for Calorie Tracker
      GenerateSecretString:
        SecretStringTemplate: '{"username":"calorieadmin"}'
        GenerateStringKey: password
        PasswordLength: 20
        ExcludeCharacters: '"@/\ '''

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Calorie Tracker DB subnet group (private subnets)
      SubnetIds:
        - Fn::ImportValue: !Sub '${ProjectName}-PrivateSubnet1Id'
        - Fn::ImportValue: !Sub '${ProjectName}-PrivateSubnet2Id'

  # Deleting or replacing the database leaves a final snapshot
  # (destroy.sh removes it unless --keep-data).
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-db'
      DBName: calorietracker
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      # Encryption at rest with the AWS-managed RDS key (no extra cost).
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: !Ref BackupRetentionDays
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      # destroy.sh switches this off before deleting the stack.
      DeletionProtection: true
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub '${ProjectName}-RdsSgId'

  # Enriches the secret with host/port/dbname once the DB exists.
  DBSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DBSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance

Outputs:
  DBEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export: { Name: !Sub '${ProjectName}-DBEndpoint' }
  DBSecretArn:
    Value: !Ref DBSecret
    Export: { Name: !Sub '${ProjectName}-DBSecretArn' }
