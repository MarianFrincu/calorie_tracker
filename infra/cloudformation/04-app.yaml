AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Calorie Tracker - Application: ECS Fargate cluster running a replicated
  pair of eureka-servers, api-gateway, backend-core, ai-service and the web
  client behind a PRIVATE
  Application Load Balancer (/api/* -> gateway, everything else -> web client).
  CloudFront is the only public entry point: it serves HTTPS on a free
  *.cloudfront.net address (or your own domain) and reaches the ALB through a
  VPC origin over AWS's private network. The stateless services auto scale on
  CPU. Imports network/db/cognito from prior stacks.

Metadata:
  cfn-lint:
    config:
      # W1030: the empty defaults of GeminiApiKey / CloudFrontCertificateArn are
      # only used behind conditions whose Rules require a real value.
      ignore_checks: [W1030]

Parameters:
  ProjectName:
    Type: String
    Default: calorietracker
  ImageTag:
    Type: String
    Default: latest
  MinCount:
    Type: Number
    Default: 1
    MinValue: 1
    Description: >
      Tasks per scalable service (gateway, backend-core, ai-service, web) when
      idle; auto scaling never goes below it.
  MaxCount:
    Type: Number
    Default: 3
    MinValue: 1
    Description: >
      Upper bound for CPU-based auto scaling of each scalable service. Extra
      tasks only run (and cost) while the load needs them.
  AiProvider:
    Type: String
    Default: library
    AllowedValues: [library, gemini]
    Description: >
      library — look foods up in the app's food library (free, no external calls)
      gemini  — Google Gemini API (requires GeminiApiKey; free tier available)
  GeminiApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Google AI Studio API key. Required when AiProvider=gemini, ignored
      otherwise. Stored in Secrets Manager and injected at container start, so
      it never appears in the task definition.
  GeminiModel:
    Type: String
    Default: gemini-3.5-flash-lite
    Description: Gemini model id. Only used when AiProvider=gemini.
  GeminiFallbackModel:
    Type: String
    Default: gemini-3.1-flash-lite
    Description: >
      Tried when GeminiModel is overloaded, out of quota or slow (it has its own
      capacity and free-tier quota). Blank = retry the same model.
  AiRateLimitPerMinute:
    Type: Number
    Default: 10
    Description: >
      Per-user AI calls allowed per minute (cost guard). Counted in the
      database by backend-core, so it holds however many ai-service tasks run.
  AiRateLimitPerDay:
    Type: Number
    Default: 200
    Description: Per-user AI calls allowed per UTC day (cost guard).
  CloudFrontPrefixListId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^pl-[0-9a-f]+$'
    Description: >
      Id of the managed prefix list com.amazonaws.global.cloudfront.origin-facing
      in this region (scripts/deploy.sh looks it up). Lets CloudFront's VPC
      origin through the ALB security group.
  DomainName:
    Type: String
    Default: ''
    Description: >
      OPTIONAL custom domain (e.g. app.example.com). Leave blank to use the free
      https://<id>.cloudfront.net address - no domain or certificate needed.
  CloudFrontCertificateArn:
    Type: String
    Default: ''
    Description: >
      Required only with DomainName: an ACM certificate for that domain, issued
      in us-east-1 (CloudFront only uses certificates from that region).
  EnableWaf:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Attach an AWS WAF web ACL to the load balancer: AWS managed common +
      known-bad-inputs rules and a per-IP rate limit. Billed per hour: about
      USD 0.011/hour (USD 8/month) plus USD 0.60 per million requests.

Rules:
  GeminiNeedsKey:
    RuleCondition: !Equals [!Ref AiProvider, gemini]
    Assertions:
      - Assert: !Not [!Equals [!Ref GeminiApiKey, '']]
        AssertDescription: AiProvider=gemini requires GeminiApiKey.
  CustomDomainNeedsCertificate:
    RuleCondition: !Not [!Equals [!Ref DomainName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CloudFrontCertificateArn, '']]
        AssertDescription: DomainName requires CloudFrontCertificateArn (an ACM certificate in us-east-1).

Conditions:
  UseGemini: !Equals [!Ref AiProvider, gemini]
  HasCustomDomain: !Not [!Equals [!Ref DomainName, '']]
  HasPrefixList: !Not [!Equals [!Ref CloudFrontPrefixListId, '']]
  WafEnabled: !Equals [!Ref EnableWaf, 'true']

Resources:

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-cluster'

  # ---------------- IAM ----------------
  # Execution role: pull images, write logs, read the injected secrets.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If
                  - UseGemini
                  - - Fn::ImportValue: !Sub '${ProjectName}-DBSecretArn'
                    - !Ref GeminiSecret
                  - - Fn::ImportValue: !Sub '${ProjectName}-DBSecretArn'

  # No task role: the containers call no AWS API, so they get no permissions.

  # ---------------- Secrets ----------------
  GeminiSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseGemini
    Properties:
      Name: !Sub '${ProjectName}/gemini-api-key'
      Description: Google Gemini API key for ai-service
      SecretString: !Ref GeminiApiKey

  # ---------------- Logs ----------------
  EurekaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/eureka'
      RetentionInDays: 14
  GatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/gateway'
      RetentionInDays: 14
  CoreLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/core'
      RetentionInDays: 14
  AiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/ai'
      RetentionInDays: 14
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/web'
      RetentionInDays: 14

  # ---------------- Load balancer ----------------
  # Internal: private subnets, unreachable from the internet.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Scheme: internal
      Type: application
      Subnets:
        - Fn::ImportValue: !Sub '${ProjectName}-PrivateSubnet1Id'
        - Fn::ImportValue: !Sub '${ProjectName}-PrivateSubnet2Id'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${ProjectName}-AlbSgId'
      LoadBalancerAttributes:
        # Drop malformed header names (request smuggling).
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        # Room for slow AI calls.
        - { Key: idle_timeout.timeout_seconds, Value: '120' }

  GatewayTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-gw-tg'
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-VpcId'
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-web-tg'
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-VpcId'
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '15' }

  # Plain HTTP: only CloudFront reaches it, over AWS's network.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  # One origin: /api/* → gateway, everything else → web client.
  ApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - { Field: path-pattern, PathPatternConfig: { Values: ['/api/*'] } }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref GatewayTargetGroup }

  AlbIngressFromCloudFront:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasPrefixList
    Properties:
      GroupId:
        Fn::ImportValue: !Sub '${ProjectName}-AlbSgId'
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !Ref CloudFrontPrefixListId
      Description: CloudFront origin-facing (VPC origin)

  # ---------------- CloudFront (the public, HTTPS entry point) ----------------
  AlbVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub '${ProjectName}-alb'
        Arn: !Ref LoadBalancer
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only

  # HSTS at the edge: behind CloudFront the containers only see plain HTTP.
  HstsPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-hsts'
        Comment: Strict-Transport-Security on every response
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true

  # Viewer headers plus CloudFront-Viewer-TLS, so the gateway and nginx can
  # refuse TLS < 1.2 (the default certificate can't). No cookies are used.
  ViewerRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${ProjectName}-viewer'
        Comment: All viewer headers + CloudFront-Viewer-TLS, all query strings, no cookies
        HeadersConfig:
          HeaderBehavior: allViewerAndWhitelistCloudFront
          Headers: [CloudFront-Viewer-TLS]
        QueryStringsConfig:
          QueryStringBehavior: all
        CookiesConfig:
          CookieBehavior: none

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} web app + API'
        HttpVersion: http2and3
        IPV6Enabled: true
        # Cheapest edge set (North America + Europe); works everywhere.
        PriceClass: PriceClass_100
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CloudFrontCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            VpcOriginConfig:
              VpcOriginId: !GetAtt AlbVpcOrigin.Id
              # AI calls can outlast the default 30 s.
              OriginReadTimeout: 90
              OriginKeepaliveTimeout: 60
        # The app shell: never cached, so a deploy shows at once.
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
          OriginRequestPolicyId: !Ref ViewerRequestPolicy
          ResponseHeadersPolicyId: !Ref HstsPolicy
          Compress: true
        CacheBehaviors:
          # The API: never cached, headers forwarded (Authorization, X-Time-Zone).
          - PathPattern: /api/*
            TargetOriginId: alb
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref ViewerRequestPolicy
            ResponseHeadersPolicyId: !Ref HstsPolicy
            Compress: true
          # Content-hashed JS/CSS bundles: cached at the edge.
          - PathPattern: /assets/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # Managed-CachingOptimized
            ResponseHeadersPolicyId: !Ref HstsPolicy
            Compress: true

  # ---------------- Optional WAF ----------------
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: WafEnabled
    Properties:
      Name: !Sub '${ProjectName}-waf'
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-waf'
      Rules:
        - Name: rate-limit-per-ip
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              # Per client IP per 5 minutes (taken from X-Forwarded-For, as
              # traffic arrives via CloudFront).
              Limit: 1500
              AggregateKeyType: FORWARDED_IP
              ForwardedIPConfig:
                HeaderName: X-Forwarded-For
                FallbackBehavior: MATCH
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-per-ip
        - Name: aws-common
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-common
        - Name: aws-known-bad-inputs
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-known-bad-inputs

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: WafEnabled
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

  # ---------------- Service discovery (Eureka) ----------------
  # Two replicating Eureka servers, eureka-a / eureka-b.<project>.local;
  # every client lists both, so either can restart without anyone noticing.
  EurekaADiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: eureka-a
      NamespaceId:
        Fn::ImportValue: !Sub '${ProjectName}-NamespaceId'
      DnsConfig:
        DnsRecords:
          - { Type: A, TTL: 15 }
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  EurekaBDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: eureka-b
      NamespaceId:
        Fn::ImportValue: !Sub '${ProjectName}-NamespaceId'
      DnsConfig:
        DnsRecords:
          - { Type: A, TTL: 15 }
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # ---------------- Task definitions ----------------
  # JVM heap at 75% of the task memory (the default 25% is too small).
  EurekaATaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-eureka-a'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: eureka
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-eureka-server:${ImageTag}'
          Essential: true
          PortMappings:
            - { ContainerPort: 8761 }
          Environment:
            - { Name: JAVA_TOOL_OPTIONS, Value: '-XX:MaxRAMPercentage=75' }
            # Peer mode: its own DNS name, replicating to the other server.
            - { Name: EUREKA_INSTANCE_HOSTNAME, Value: !Sub 'eureka-a.${ProjectName}.local' }
            - { Name: EUREKA_CLIENT_REGISTERWITHEUREKA, Value: 'true' }
            - { Name: EUREKA_CLIENT_FETCHREGISTRY, Value: 'true' }
            - { Name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, Value: !Sub 'http://eureka-b.${ProjectName}.local:8761/eureka/' }
          HealthCheck:
            Command: ['CMD-SHELL', 'curl -fsS http://localhost:8761/actuator/health | grep -q UP || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 90
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EurekaLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: eureka-a

  EurekaBTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-eureka-b'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: eureka
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-eureka-server:${ImageTag}'
          Essential: true
          PortMappings:
            - { ContainerPort: 8761 }
          Environment:
            - { Name: JAVA_TOOL_OPTIONS, Value: '-XX:MaxRAMPercentage=75' }
            # Peer mode: its own DNS name, replicating to the other server.
            - { Name: EUREKA_INSTANCE_HOSTNAME, Value: !Sub 'eureka-b.${ProjectName}.local' }
            - { Name: EUREKA_CLIENT_REGISTERWITHEUREKA, Value: 'true' }
            - { Name: EUREKA_CLIENT_FETCHREGISTRY, Value: 'true' }
            - { Name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, Value: !Sub 'http://eureka-a.${ProjectName}.local:8761/eureka/' }
          HealthCheck:
            Command: ['CMD-SHELL', 'curl -fsS http://localhost:8761/actuator/health | grep -q UP || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 90
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EurekaLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: eureka-b

  CoreTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-core'
      Cpu: '256'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: backend-core
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-backend-core:${ImageTag}'
          Essential: true
          PortMappings:
            - { ContainerPort: 8081 }
          Environment:
            - { Name: SPRING_PROFILES_ACTIVE, Value: cognito }
            - { Name: JAVA_TOOL_OPTIONS, Value: '-XX:MaxRAMPercentage=75' }
            - { Name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, Value: !Sub 'http://eureka-a.${ProjectName}.local:8761/eureka/,http://eureka-b.${ProjectName}.local:8761/eureka/' }
            - { Name: SPRING_CLOUD_INETUTILS_PREFERRED_NETWORKS, Value: '10.0' }
            - { Name: CALORIETRACKER_AI_RATE_LIMIT_PER_MINUTE, Value: !Ref AiRateLimitPerMinute }
            - { Name: CALORIETRACKER_AI_RATE_LIMIT_PER_DAY, Value: !Ref AiRateLimitPerDay }
            - Name: COGNITO_ISSUER_URI
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-IssuerUri'
            - Name: COGNITO_CLIENT_ID
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-AppClientId'
            # Verified TLS to RDS (CA bundle baked into the image).
            - Name: SPRING_DATASOURCE_URL
              Value: !Sub
                - 'jdbc:postgresql://${Endpoint}:5432/calorietracker?sslmode=verify-full&sslrootcert=/app/certs/rds-global-bundle.pem'
                - Endpoint:
                    Fn::ImportValue: !Sub '${ProjectName}-DBEndpoint'
          Secrets:
            - Name: SPRING_DATASOURCE_USERNAME
              ValueFrom: !Sub
                - '${Arn}:username::'
                - Arn:
                    Fn::ImportValue: !Sub '${ProjectName}-DBSecretArn'
            - Name: SPRING_DATASOURCE_PASSWORD
              ValueFrom: !Sub
                - '${Arn}:password::'
                - Arn:
                    Fn::ImportValue: !Sub '${ProjectName}-DBSecretArn'
          HealthCheck:
            Command: ['CMD-SHELL', 'curl -fsS http://localhost:8081/actuator/health | grep -q UP || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 120
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CoreLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: core

  AiTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-ai'
      Cpu: '256'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: ai-service
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-ai-service:${ImageTag}'
          Essential: true
          PortMappings:
            - { ContainerPort: 8082 }
          Environment:
            - { Name: SPRING_PROFILES_ACTIVE, Value: cognito }
            - { Name: JAVA_TOOL_OPTIONS, Value: '-XX:MaxRAMPercentage=75' }
            - { Name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, Value: !Sub 'http://eureka-a.${ProjectName}.local:8761/eureka/,http://eureka-b.${ProjectName}.local:8761/eureka/' }
            - { Name: SPRING_CLOUD_INETUTILS_PREFERRED_NETWORKS, Value: '10.0' }
            - { Name: CALORIETRACKER_AI_PROVIDER, Value: !Ref AiProvider }
            - { Name: GEMINI_MODEL, Value: !Ref GeminiModel }
            - { Name: GEMINI_FALLBACK_MODEL, Value: !Ref GeminiFallbackModel }
            - Name: COGNITO_ISSUER_URI
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-IssuerUri'
            - Name: COGNITO_CLIENT_ID
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-AppClientId'
          # Read from Secrets Manager at start; the task definition holds only the ARN.
          Secrets: !If
            - UseGemini
            - - { Name: GEMINI_API_KEY, ValueFrom: !Ref GeminiSecret }
            - !Ref AWS::NoValue
          HealthCheck:
            Command: ['CMD-SHELL', 'curl -fsS http://localhost:8082/actuator/health | grep -q UP || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 120
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ai

  GatewayTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-gateway'
      Cpu: '256'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: api-gateway
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-api-gateway:${ImageTag}'
          Essential: true
          PortMappings:
            - { ContainerPort: 8080 }
          Environment:
            - { Name: SPRING_PROFILES_ACTIVE, Value: cognito }
            - { Name: JAVA_TOOL_OPTIONS, Value: '-XX:MaxRAMPercentage=75' }
            - { Name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, Value: !Sub 'http://eureka-a.${ProjectName}.local:8761/eureka/,http://eureka-b.${ProjectName}.local:8761/eureka/' }
            - { Name: SPRING_CLOUD_INETUTILS_PREFERRED_NETWORKS, Value: '10.0' }
            - Name: COGNITO_ISSUER_URI
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-IssuerUri'
            - Name: COGNITO_CLIENT_ID
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-AppClientId'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GatewayLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gateway

  WebTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-web'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: web-client
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-web-client:${ImageTag}'
          Essential: true
          PortMappings:
            - { ContainerPort: 8080 }
          Environment:
            # Amazon's VPC DNS (nginx's /api proxy is unused here: the ALB routes /api).
            - { Name: DNS_RESOLVER, Value: 169.254.169.253 }
            # The one cross-origin endpoint the CSP allows (sign-in).
            - { Name: COGNITO_IDP_ORIGIN, Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  # ---------------- Services ----------------
  # A deployment that can't get healthy rolls back automatically.
  EurekaAService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-eureka-a'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      # One task each, in different availability zones.
      DesiredCount: 1
      TaskDefinition: !Ref EurekaATaskDef
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub '${ProjectName}-PublicSubnet1Id'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${ProjectName}-EcsSgId'
      ServiceRegistries:
        - RegistryArn: !GetAtt EurekaADiscovery.Arn

  EurekaBService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-eureka-b'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      # One task each, in different availability zones.
      DesiredCount: 1
      TaskDefinition: !Ref EurekaBTaskDef
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub '${ProjectName}-PublicSubnet2Id'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${ProjectName}-EcsSgId'
      ServiceRegistries:
        - RegistryArn: !GetAtt EurekaBDiscovery.Arn

  CoreService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-core'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      # No DesiredCount: auto scaling owns it, so updates don't reset it.
      TaskDefinition: !Ref CoreTaskDef
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub '${ProjectName}-PublicSubnet1Id'
            - Fn::ImportValue: !Sub '${ProjectName}-PublicSubnet2Id'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${ProjectName}-EcsSgId'

  AiService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-ai'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      # No DesiredCount: auto scaling owns it, so updates don't reset it.
      TaskDefinition: !Ref AiTaskDef
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub '${ProjectName}-PublicSubnet1Id'
            - Fn::ImportValue: !Sub '${ProjectName}-PublicSubnet2Id'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${ProjectName}-EcsSgId'

  GatewayService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub '${ProjectName}-gateway'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      # No DesiredCount: auto scaling owns it, so updates don't reset it.
      TaskDefinition: !Ref GatewayTaskDef
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub '${ProjectName}-PublicSubnet1Id'
            - Fn::ImportValue: !Sub '${ProjectName}-PublicSubnet2Id'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${ProjectName}-EcsSgId'
      LoadBalancers:
        - TargetGroupArn: !Ref GatewayTargetGroup
          ContainerName: api-gateway
          ContainerPort: 8080

  WebService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub '${ProjectName}-web'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      # No DesiredCount: auto scaling owns it, so updates don't reset it.
      TaskDefinition: !Ref WebTaskDef
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub '${ProjectName}-PublicSubnet1Id'
            - Fn::ImportValue: !Sub '${ProjectName}-PublicSubnet2Id'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${ProjectName}-EcsSgId'
      LoadBalancers:
        - TargetGroupArn: !Ref WebTargetGroup
          ContainerName: web-client
          ContainerPort: 8080

  # ---------------- Auto scaling ----------------
  # The stateless services scale on CPU between MinCount and MaxCount tasks.
  GatewayScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${GatewayService.Name}'
      MinCapacity: !Ref MinCount
      MaxCapacity: !Ref MaxCount
  GatewayCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-gateway-cpu'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref GatewayScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }
        TargetValue: 60
        ScaleOutCooldown: 60
        ScaleInCooldown: 300
  CoreScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${CoreService.Name}'
      MinCapacity: !Ref MinCount
      MaxCapacity: !Ref MaxCount
  CoreCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-core-cpu'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref CoreScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }
        TargetValue: 60
        ScaleOutCooldown: 60
        ScaleInCooldown: 300
  AiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${AiService.Name}'
      MinCapacity: !Ref MinCount
      MaxCapacity: !Ref MaxCount
  AiCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-ai-cpu'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }
        TargetValue: 60
        ScaleOutCooldown: 60
        ScaleInCooldown: 300
  WebScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${WebService.Name}'
      MinCapacity: !Ref MinCount
      MaxCapacity: !Ref MaxCount
  WebCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-web-cpu'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref WebScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }
        TargetValue: 60
        ScaleOutCooldown: 60
        ScaleInCooldown: 300

Outputs:
  AppUrl:
    Description: >
      Open this in a browser: the web app, and under /api the API. Always HTTPS.
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${Distribution.DomainName}'
  ApiUrl:
    Description: Base URL for the desktop client (api.base.url). Same origin as the web app.
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${Distribution.DomainName}'
  CloudFrontDomainName:
    Description: >
      With a custom domain, create a CNAME from DomainName to this value at
      your DNS provider.
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  ClusterName:
    Value: !Ref Cluster
