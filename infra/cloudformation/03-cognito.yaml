AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Calorie Tracker - Identity: AWS Cognito user pool with USER/ADMIN groups, a
  public app client for the JavaFX desktop client (USER_PASSWORD_AUTH), and a
  confidential client for machine-to-machine (client_credentials) calls.

Parameters:
  ProjectName:
    Type: String
    Default: calorietracker

Resources:

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-pool'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  # Hosted domain - required for the OAuth2 token endpoint (M2M client_credentials).
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${ProjectName}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  # Resource server defines the M2M scopes.
  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: calorietracker-api
      Name: Calorie Tracker API
      Scopes:
        - { ScopeName: foods.read,  ScopeDescription: Read food entries }
        - { ScopeName: foods.write, ScopeDescription: Create/update/delete food entries }

  # Roles are modeled as Cognito groups -> mapped to ROLE_* by the services.
  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: USER
      UserPoolId: !Ref UserPool
      Precedence: 10
      Description: Regular users (read + AI)

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: ADMIN
      UserPoolId: !Ref UserPool
      Precedence: 1
      Description: Administrators (full write access)

  # Public client for the JavaFX desktop app (no secret; direct username/password).
  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-desktop'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # Confidential client for machine-to-machine (service-to-service) calls.
  M2MClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      ClientName: !Sub '${ProjectName}-m2m'
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes:
        - calorietracker-api/foods.read
        - calorietracker-api/foods.write
      SupportedIdentityProviders: [COGNITO]

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export: { Name: !Sub '${ProjectName}-UserPoolId' }
  IssuerUri:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
    Export: { Name: !Sub '${ProjectName}-IssuerUri' }
  AppClientId:
    Value: !Ref AppClient
    Export: { Name: !Sub '${ProjectName}-AppClientId' }
  M2MClientId:
    Value: !Ref M2MClient
  TokenEndpoint:
    Value: !Sub 'https://${ProjectName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'
  HostedDomain:
    Value: !Sub 'https://${ProjectName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'
