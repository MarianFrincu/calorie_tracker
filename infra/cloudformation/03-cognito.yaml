AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Calorie Tracker - Identity: AWS Cognito user pool (email sign-in, verified
  email for recovery) and the one public app client shared by the web and
  desktop apps (SRP sign-in + revocable refresh tokens). The services
  accept only access tokens issued to this client.

Parameters:
  ProjectName:
    Type: String
    Default: calorietracker

Resources:

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-pool'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # destroy.sh turns this off first.
      DeletionProtection: ACTIVE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      # Password resets only via the verified email address.
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          # Mirrored by the clients' live password checklist.
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  # Public client (no secret) shared by the web and desktop apps.
  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-app'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        # Both apps sign in with SRP: the password never leaves the device.
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        # Needs AWS credentials (AdminInitiateAuth); used by smoke-test.sh.
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      # Same answers whether or not an email is registered.
      PreventUserExistenceErrors: ENABLED
      # Sign-out revokes the refresh token and its access tokens.
      EnableTokenRevocation: true
      AuthSessionValidity: 3
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export: { Name: !Sub '${ProjectName}-UserPoolId' }
  IssuerUri:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
    Export: { Name: !Sub '${ProjectName}-IssuerUri' }
  AppClientId:
    Value: !Ref AppClient
    Export: { Name: !Sub '${ProjectName}-AppClientId' }
