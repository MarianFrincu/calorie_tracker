AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Calorie Tracker - CI/CD: a GitHub-sourced CodePipeline that runs a CodeBuild
  project to build the four Docker images, push them to ECR, and force a new
  deployment of every ECS service.

  Source: AWS CodeStar Connections (CodeConnections) to a private GitHub
  repository. Create the connection ONCE via the AWS console
  (CodePipeline -> Settings -> Connections -> Create connection -> GitHub),
  authorize the AWS Connector for GitHub for the repo, then pass its ARN here
  via the GitHubConnectionArn parameter. Every push to the chosen branch
  triggers the pipeline automatically.

  Roles: this template CREATES dedicated CodeBuild + CodePipeline roles
  (run with --capabilities CAPABILITY_NAMED_IAM).

Parameters:
  ProjectName:
    Type: String
    Default: calorietracker

  GitHubConnectionArn:
    Type: String
    Description: >
      ARN of the GitHub CodeStar/CodeConnections connection (Available state).
      Looks like arn:aws:codeconnections:us-east-1:<acct>:connection/<uuid>.
    AllowedPattern: '^arn:aws:codeconnections:.+:connection/.+$|^arn:aws:codestar-connections:.+:connection/.+$'

  GitHubFullRepo:
    Type: String
    Description: 'GitHub owner/repo (e.g. mariusexample/calorie_tracker).'
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'

  GitHubBranch:
    Type: String
    Default: main
    Description: Branch to track. Every push here triggers the pipeline.

Resources:

  # Artifact store used between Source -> Build stages. Short retention since
  # nothing downstream of the pipeline reads it.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - { Id: expire, Status: Enabled, ExpirationInDays: 7 }

  # ---------------- IAM ----------------
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-*'
              - Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:GetBucketVersioning]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:GetBucketVersioning, s3:GetObjectVersion]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: '*'
              # Required so CodePipeline can pull from the GitHub connection
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref GitHubConnectionArn

  # ---------------- CodeBuild ----------------
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-build'
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true   # needed for 'docker build'
        EnvironmentVariables:
          - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
          - { Name: ACCOUNT_ID, Value: !Ref AWS::AccountId }
          - { Name: PROJECT, Value: !Ref ProjectName }
          - { Name: ECR, Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com' }
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                java: corretto21
            pre_build:
              commands:
                - echo Running unit tests on every Maven module...
                - |
                  for svc in eureka-server api-gateway backend-core ai-service; do
                    echo "Testing $svc...";
                    (cd $svc && mvn -B -q test);
                  done
                - echo Logging in to ECR...
                - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR
            build:
              commands:
                - |
                  for svc in eureka-server api-gateway backend-core ai-service; do
                    echo "Building $svc...";
                    docker build --platform linux/amd64 -t $ECR/$PROJECT-$svc:latest ./$svc;
                    docker push $ECR/$PROJECT-$svc:latest;
                  done
            post_build:
              commands:
                - echo Forcing new ECS deployments...
                - aws ecs update-service --cluster $PROJECT-cluster --service $PROJECT-eureka  --force-new-deployment
                - aws ecs update-service --cluster $PROJECT-cluster --service $PROJECT-gateway --force-new-deployment
                - aws ecs update-service --cluster $PROJECT-cluster --service $PROJECT-core    --force-new-deployment
                - aws ecs update-service --cluster $PROJECT-cluster --service $PROJECT-ai      --force-new-deployment

  # ---------------- CodePipeline ----------------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}-pipeline'
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              # CodeStar Connections (a.k.a. CodeConnections) provider talks to
              # GitHub via the OAuth app installed once at connection creation.
              # DetectChanges=true means GitHub will push CloudWatch events to
              # CodePipeline on every commit to GitHubBranch -> instant trigger.
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubFullRepo
                BranchName: !Ref GitHubBranch
                DetectChanges: 'true'
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts: [{ Name: SourceOutput }]
        - Name: BuildAndDeploy
          Actions:
            - Name: Build
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration: { ProjectName: !Ref BuildProject }
              InputArtifacts: [{ Name: SourceOutput }]

Outputs:
  PipelineName:
    Description: CodePipeline name. Triggered automatically on every push to the configured branch.
    Value: !Ref Pipeline
  PipelineConsoleUrl:
    Description: Click to watch pipeline runs in the AWS console.
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view'
  TrackedRepo:
    Value: !Sub 'github.com/${GitHubFullRepo}@${GitHubBranch}'
