AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Calorie Tracker - CI/CD: a GitHub-sourced CodePipeline whose CodeBuild project
  (steps in infra/buildspec.yml) runs every test suite and the browser tests,
  pushes the five Docker images to ECR, rolls the ECS services and smoke-tests
  the live app.

  Source: AWS CodeStar Connections (CodeConnections) to a private GitHub
  repository. Create the connection ONCE via the AWS console
  (CodePipeline -> Settings -> Connections -> Create connection -> GitHub),
  authorize the AWS Connector for GitHub for the repo, then pass its ARN here
  via the GitHubConnectionArn parameter. Every push to the chosen branch
  triggers the pipeline automatically.

  Roles: this template CREATES dedicated CodeBuild + CodePipeline roles
  (run with --capabilities CAPABILITY_NAMED_IAM).

Parameters:
  ProjectName:
    Type: String
    Default: calorietracker

  GitHubConnectionArn:
    Type: String
    Description: >
      ARN of the GitHub CodeStar/CodeConnections connection (Available state).
      Looks like arn:aws:codeconnections:<region>:<acct>:connection/<uuid>
      where <region> is the region you created the CodeStar connection in
      (must match where you deploy this stack — typically the same as the
      app stack, e.g. eu-central-1).
    AllowedPattern: '^arn:aws:codeconnections:.+:connection/.+$|^arn:aws:codestar-connections:.+:connection/.+$'

  GitHubFullRepo:
    Type: String
    Description: 'GitHub owner/repo (e.g. mariusexample/calorie_tracker).'
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'

  GitHubBranch:
    Type: String
    Default: main
    Description: Branch to track. Every push here triggers the pipeline.

Resources:

  # Hand-off between pipeline stages; nothing reads it later.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - { Id: expire, Status: Enabled, ExpirationInDays: 7 }

  # ---------------- IAM ----------------
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-*'
              - Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: '*'
              # Stack outputs: Cognito ids for the web build, URL for the smoke test.
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-cognito/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-app/*'
              # Smoke test: a throwaway user in this project's pool only.
              - Effect: Allow
                Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminSetUserPassword, cognito-idp:AdminInitiateAuth, cognito-idp:AdminDeleteUser]
                Resource: !Sub
                  - 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${PoolId}'
                  - PoolId:
                      Fn::ImportValue: !Sub '${ProjectName}-UserPoolId'
              # Smoke test: confirms the load balancer is private.
              - Effect: Allow
                Action: elasticloadbalancing:DescribeLoadBalancers
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:GetBucketVersioning]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
              # Full git clone, so the buildspec can skip docs-only commits.
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref GitHubConnectionArn
              - Effect: Allow
                Action: codeconnections:UseConnection
                Resource: !Ref GitHubConnectionArn

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:GetBucketVersioning, s3:GetObjectVersion]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: '*'
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref GitHubConnectionArn
              - Effect: Allow
                Action: codeconnections:UseConnection
                Resource: !Ref GitHubConnectionArn

  # ---------------- CodeBuild ----------------
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-build'
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      TimeoutInMinutes: 60
      # Reuse Docker layers and Maven downloads between builds.
      Cache:
        Type: LOCAL
        Modes: [LOCAL_DOCKER_LAYER_CACHE, LOCAL_CUSTOM_CACHE]
      Environment:
        Type: LINUX_CONTAINER
        # 4 vCPU / 7 GB for the whole app + a browser; ~USD 0.01/minute while running.
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true   # needed for docker build / docker compose / Testcontainers
        EnvironmentVariables:
          - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
          - { Name: ACCOUNT_ID, Value: !Ref AWS::AccountId }
          - { Name: PROJECT, Value: !Ref ProjectName }
          - { Name: ECR, Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com' }
          # Ryuk comes from Docker Hub (rate limits); the machine is thrown away anyway.
          - { Name: TESTCONTAINERS_RYUK_DISABLED, Value: 'true' }
      Source:
        Type: CODEPIPELINE
        # The steps live in the repo, versioned with the code they build.
        BuildSpec: infra/buildspec.yml

  # ---------------- CodePipeline ----------------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}-pipeline'
      # V2: billed per action-minute, no monthly fee (V1 costs USD 1/month).
      PipelineType: V2
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              # Every push to GitHubBranch starts a run.
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubFullRepo
                BranchName: !Ref GitHubBranch
                DetectChanges: 'true'
                # Git history, for the docs-only check.
                OutputArtifactFormat: CODEBUILD_CLONE_REF
              OutputArtifacts: [{ Name: SourceOutput }]
        - Name: BuildAndDeploy
          Actions:
            - Name: Build
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration: { ProjectName: !Ref BuildProject }
              InputArtifacts: [{ Name: SourceOutput }]

Outputs:
  PipelineName:
    Description: CodePipeline name. Triggered automatically on every push to the configured branch.
    Value: !Ref Pipeline
  PipelineConsoleUrl:
    Description: Click to watch pipeline runs in the AWS console.
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view'
  TrackedRepo:
    Value: !Sub 'github.com/${GitHubFullRepo}@${GitHubBranch}'
