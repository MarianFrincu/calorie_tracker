# Calorie Tracker desktop client — default configuration.
#
# THIS FILE INTENTIONALLY CONTAINS ONLY LOCAL-DEV DEFAULTS. Account-specific
# values come from the environment (API_BASE_URL, AUTH_MODE, COGNITO_USER_POOL_ID,
# COGNITO_CLIENT_ID) or -D flags (-Dapi.base.url=...), which override this file.
#
#   make desktop          local stack (these defaults)
#   make desktop-cloud    the deployed app: reads the URL and Cognito client id
#                         from your CloudFormation stacks

# Local dev stack (make up, 'dev' profile = no sign-in):
api.base.url=http://localhost:8080
auth.mode=none

# Left blank by design — set via the environment when running against AWS.
cognito.user.pool.id=
cognito.client.id=
