# Calorie Tracker desktop client configuration.
# Override any value with -Dkey=value or env vars (e.g. API_BASE_URL).

# Local dev stack (docker compose up, 'dev' profile = no auth):
api.base.url=http://localhost:8080
auth.mode=none

# Cloud (set auth.mode=cognito and point api.base.url at the ALB URL):
# api.base.url=http://<your-alb-dns>
# auth.mode=cognito
cognito.region=us-east-1
cognito.client.id=
