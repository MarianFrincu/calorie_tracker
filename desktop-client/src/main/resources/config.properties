# Calorie Tracker desktop client — default configuration.
#
# THIS FILE INTENTIONALLY CONTAINS ONLY LOCAL-DEV DEFAULTS.
# Do NOT add your cloud ALB URL or Cognito client id here — those are
# account-specific. Pass them as -D flags at launch:
#
#   mvn -f desktop-client/pom.xml javafx:run \
#     -Dapi.base.url=<ALB URL> \
#     -Dauth.mode=cognito \
#     -Dcognito.region=<region> \
#     -Dcognito.client.id=<client id>
#
# Or, easier — use scripts/run-ui.sh which reads .envrc + CFN outputs
# automatically. See c_t_docs/SCRIPTS.md.

# Local dev stack (docker compose up, 'dev' profile = no auth):
api.base.url=http://localhost:8080
auth.mode=none

# Cognito values left blank by design — set via -D flags when running against AWS.
cognito.region=
cognito.client.id=
