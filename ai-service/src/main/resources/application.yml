server:
  port: 8082
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: ai-service
  cloud:
    loadbalancer:
      cache:
        # Default 35 s would keep an empty "no backend-core yet" from startup.
        ttl: 5s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    # Register ~5 s after startup instead of the default 40 s.
    initial-instance-info-replication-interval-seconds: 5
    # See new instances within ~5 s (default 30 s).
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Public (health checks), so only UP/DOWN - no internal details.
      show-details: never
      show-components: never

# Provider: library (default, the food library) | gemini (GEMINI_API_KEY) | mock (tests)
calorietracker:
  ai:
    provider: ${CALORIETRACKER_AI_PROVIDER:library}
    library:
      # backend-core via Eureka: food library + AI quota.
      base-url: ${CALORIETRACKER_AI_LIBRARY_BASE_URL:http://backend-core}
