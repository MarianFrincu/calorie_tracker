# The whole app locally: `make up` → http://localhost:8088 (API on :8080).
# Spring profile `dev`: no sign-in, every request is 'dev-user'. The same
# images run on AWS with the `cognito` profile (infra/cloudformation/04-app.yaml).
# Ports are bound to 127.0.0.1 only: no auth and a known DB password.

services:
  postgres:
    # ECR Public mirror of Docker Hub: no pull rate limits.
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_DB: calorietracker
      POSTGRES_USER: calorie
      POSTGRES_PASSWORD: calorie
    ports:
      # 15432 on the host, so a local PostgreSQL on 5432 doesn't clash.
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorie -d calorietracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ct-net

  eureka-server:
    build: ./eureka-server
    image: calorietracker/eureka-server:local
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - ct-net

  backend-core:
    build: ./backend-core
    image: calorietracker/backend-core:local
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/calorietracker
      SPRING_DATASOURCE_USERNAME: calorie
      SPRING_DATASOURCE_PASSWORD: calorie
      # Per-user AI quota (enforced here, for every ai-service).
      CALORIETRACKER_AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-10}
      CALORIETRACKER_AI_RATE_LIMIT_PER_DAY: ${AI_RATE_LIMIT_PER_DAY:-200}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ct-net

  ai-service:
    build: ./ai-service
    image: calorietracker/ai-service:local
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # library (default) | gemini (make up picks it when .envrc has a key) | mock (tests)
      CALORIETRACKER_AI_PROVIDER: ${CALORIETRACKER_AI_PROVIDER:-library}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # The fallback model is tried when the first is busy or out of quota.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.1-flash-lite}
    depends_on:
      eureka-server:
        condition: service_healthy
      # Every AI call checks the quota on backend-core.
      backend-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ct-net

  api-gateway:
    build: ./api-gateway
    image: calorietracker/api-gateway:local
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ct-net

  # nginx serves the app and proxies /api to the gateway (one origin).
  web-client:
    build:
      context: ./web-client
      args:
        VITE_AUTH_MODE: none
    image: calorietracker/web-client:local
    environment:
      API_UPSTREAM: http://api-gateway:8080
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ct-net

volumes:
  pgdata:

networks:
  ct-net:
    driver: bridge
