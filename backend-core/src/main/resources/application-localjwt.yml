# Activated with: SPRING_PROFILES_ACTIVE=localjwt
# Offline security: validate JWTs against a baked-in RSA public key (no AWS).
# This mirrors how Cognito tokens are validated, but without a live IdP.

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/local-public.pem
