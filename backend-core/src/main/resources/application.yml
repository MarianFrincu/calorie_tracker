server:
  port: 8081
  error:
    # No internals in Spring's default error page (GlobalExceptionHandler writes ours).
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: backend-core
  datasource:
    # Local defaults; compose and AWS set these through the environment.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/calorietracker}
    username: ${SPRING_DATASOURCE_USERNAME:calorie}
    password: ${SPRING_DATASOURCE_PASSWORD:calorie}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # Adopt a database that already has tables but no Flyway history.
    baseline-on-migrate: true
    baseline-version: 0

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    # Register ~5 s after startup instead of the default 40 s.
    initial-instance-info-replication-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    # Register by IP (works in Docker and on ECS).
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Public (health checks), so only UP/DOWN - no internal details.
      show-details: never
      show-components: never

# Per-user AI quota for every ai-service task (AiQuotaService).
calorietracker:
  ai:
    rate-limit:
      per-minute: ${CALORIETRACKER_AI_RATE_LIMIT_PER_MINUTE:10}
      per-day: ${CALORIETRACKER_AI_RATE_LIMIT_PER_DAY:200}
