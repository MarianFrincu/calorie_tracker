# Activated with: SPRING_PROFILES_ACTIVE=bedrock
# Turns on the real AWS Bedrock LLM for the ingredient parser.
#
# Credentials are resolved via the default AWS chain (env vars, ~/.aws, or — in
# the cloud — the ECS task IAM role). Region + model id are overridable via env.

spring:
  ai:
    model:
      # Re-enable the Bedrock Converse chat model (disabled in the default profile).
      chat: bedrock-converse
    bedrock:
      aws:
        region: ${AWS_REGION:eu-central-1}
      converse:
        chat:
          options:
            # Set BEDROCK_MODEL_ID to a model you have access to in your region.
            # Cross-region inference profile ids look like 'eu.' / 'us.' prefixed.
            model: ${BEDROCK_MODEL_ID:eu.anthropic.claude-3-5-sonnet-20240620-v1:0}
            temperature: 0.2

calorietracker:
  ai:
    provider: bedrock
